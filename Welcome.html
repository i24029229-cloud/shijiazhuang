    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Shijiazhuang</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .welcome-screen {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)), url('./images/1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .welcome-content {
            z-index: 10;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        .welcome-content h1 {
            font-size: clamp(3rem, 12vw, 7rem);
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .welcome-content p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
            opacity: 0.9;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .welcome-btn {
            background: var(--primary-color);
            color: #ffffff;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 100px;
            text-decoration: none;
            transition: var(--transition);
            display: inline-block;
            box-shadow: 0 15px 35px rgba(8, 145, 178, 0.4);
            border: 2px solid transparent;
        }

        .welcome-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: transparent;
            border-color: #ffffff;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ambient animation */
        .ambient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent, rgba(0,0,0,0.3));
            pointer-events: none;
        }
    </style>
</head>
<body style="margin:0; overflow:hidden;">

    <div class="welcome-screen">
        <div class="ambient"></div>
        <div class="welcome-content">
            <h1>SHIJIAZHUANG</h1>
            <p>Experience the Charm of the Radiant Heart of Hebei Province.</p>
            <a href="index.html" class="welcome-btn">Start Your Journey</a>
        </div>
    </div>

</body>
</html>
